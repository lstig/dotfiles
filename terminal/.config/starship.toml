# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """
$all\
$fill\
$status\
$cmd_duration\
$line_break\
$username\
$hostname\
$localip\
$character
"""

[cmd_duration]
format = '[$duration]($style)'

[directory]
truncate_to_repo = false
style = 'bold blue'

[fill]
symbol = ' '

[git_branch]
style = 'bold cyan'

[git_status]
style = 'bold yellow'

[hostname]
format = '$ssh_symbol[$hostname]($style) '
ssh_symbol = '@'

[status]
disabled = false

[username]
format = '[$user]($style)'

[terraform]
disabled = true

[aws]
symbol = ''
