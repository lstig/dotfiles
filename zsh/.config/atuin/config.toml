## Atuin client config. Full reference: https://docs.atuin.sh/configuration/config/

# skim is the newer fuzzy matcher; default is "fuzzy".
search_mode = "skim"

# Small popup instead of full-screen TUI. inline_height = 10 leaves room for
# the search bar and help/version row, landing on ~5-10 visible result rows.
# Same height applied to the up-arrow binding for consistency.
style = "compact"
inline_height = 10
inline_height_shell_up_key_binding = 10

# Mirrors HISTORY_IGNORE in .config/zsh/.zshrc.
history_filter = [
  "^yt-dl",
]

# Stock default for new installs: enter runs the selected command immediately,
# tab edits it instead. Kept as-is.
enter_accept = true

# Url to the remote sync server
sync_address = "https://atuin.internal.stignet.com"

[theme]
# https://github.com/catppuccin/atuin — matches the catppuccin-mocha pi agent
# theme (agents/.pi/agent/themes/catppuccin-mocha.json, accent: mauve).
name = "catppuccin-mocha-mauve"

[sync]
# Stock default for new installs: enables sync v2. Kept as-is.
records = true

[daemon]
enabled = true
autostart = true
